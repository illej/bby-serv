<!doctype html>
<html lang="en">
<head>
    <title>Baby's First Media Server</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        .info { color: blue; }
        .error { color: red; }
        .warning { color: yellow; }
    </style>
    <script>
        debug = [];

        window.onerror = (a, b, c, d, e) => {
            log(`message: ${a} source: ${b} lineno: ${c} colno: ${d} error: ${e}`);
            return true;
        };

        String.prototype.fmt = function() {
            var args = arguments;
            return this.replace(/\{(\d+)\}/g, function (m, n) { return args[n]; });
        };

        function log(msg) {
            var toaster = document.getElementById('toaster');
            var str = '';

            debug.unshift('<p class="debug">[{0}]: {1}</p>'.fmt(new Date(Date.now()).toLocaleString(), msg));
            if (debug.length > 5) {
                debug.length = 5;
            }

            for (var i = 0; i < debug.length; i++)
            {
                str += debug[debug.length - i - 1]; 
            }

            toaster.className = "show";
            toaster.innerHTML = str;

            setTimeout(function () {
                toaster.className.replace("show", "");
            }, 3000);
        }

        function play(e) {
            console.log('play: event:', e);
            console.log('play: this.id:', this.id);

            const element = this;

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    console.log('play: ' + this.responseText);
                }
            };
            xhr.open("POST", "/play", true);
            xhr.send('id=' + this.id);
        }

        function test() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("demo").textContent = this.responseText;
                }
            };
            xhr.open("GET", "/test", true);
            xhr.send();
        };

        var reconnect_freq_sec = 1;
        var es;
        var events;
        var max = 10; // 64
        var version = 0;

        function reconnect() {
            console.log('ehsa: reconnect in ' + reconnect_freq_sec + ' seconds');

            setTimeout(event_source_setup, reconnect_freq_sec * 1000);

            reconnect_freq_sec *= 2;
            if (reconnect_freq_sec >= max) {
                reconnect_freq_sec = max;
            }
        }

        function event_source_setup() {
            console.log("ehsa: EventSource setup");

            es = new EventSource('/events');
            es.addEventListener('update', function(e) {
                log("event.update: {0}".fmt(e.data));
                console.log("event.update: data=%o", e.data);

                const list = document.getElementById("track-list");
                const data = JSON.parse(e.data);
                const track_list = data["track-list"];

                for (var i = 0; i < track_list.length; i++)
                {
                    const track = track_list[i];
                    const element = document.getElementById(track.id);

                    if (track.active)
                        element.classList.add("active");
                    else
                        element.classList.remove("active");
                }
            });
            es.addEventListener('hello', function(e) {
                log("event.hello: {0}".fmt(e.data));
                console.log("event.hello: %o", e.data);

                const data = JSON.parse(e.data);
                const new_version = parseInt(data.version);

                if (version == 0) {
                    version = new_version;
                    console.log('event.hello: set version={0}'.fmt(new_version));
                } else if (version != new_version) {
                    console.log('event.hello: version miss-match {0} != {0}. reloading..'.fmt(version, new_version));
                    version = new_version;
                    window.location.reload();
                }

                const list = document.getElementById('track-list');
                const track_list = data["track-list"];

                while (list.firstChild) {
                    list.removeChild(list.firstChild);
                }

                for (var i = 0; i < track_list.length; i++)
                {
                    const track = track_list[i];
                    const item = document.createElement('li');

                    item.innerHTML = track.name;
                    item.id = track.id;
                    item.classList.add("list-group-item");
                    if (track.active)
                        item.classList.add("active");
                    item.addEventListener('click', play);

                    list.appendChild(item);
                }
            });

            es.onmessage = function(e) {
                log("event.message: {0}".fmt(e.data));
                console.log("event.message: " + e.data);

                events.unshift(event.data + '<br>');
                if (events.length > 10) {
                    events.length = 10;
                }

                var str = '';
                for (var i = 0; i < events.length; i++)
                {
                    str += events[events.length - i - 1]; 
                }

                document.getElementById('status').innerHTML = str;

            };
            es.onopen = function(e) {
                log("event.open: connection opened");
                console.log("event.open: connection opened");

                reconnect_freq_sec = 1;
                events = [];
            };
            es.onerror = function(e) {
                log("event.error: connection failed");
                console.error('event.error:', e);

                es.close();
                reconnect();
            };
        }

        if (typeof(EventSource) !== "undefined") {
            event_source_setup();
        } else {
            document.getElementById('status').textContent = 'Unsupported';
        }
    </script>
</head>
<body class="container">
    <h3>Media Server</h3>
    <div id="toaster"></div>
    <h4 id="status"></h4>
    <ul class="list-group" id="track-list">
    </ul>
    <button class="btn" type="button" onclick="test()" id="demo">On</button>
</body>
</html>
